<section class="search-panel">
  <div class="search-header">
    <div>
      <h2>
        Find Your Home
      </h2>
      <p>
        Search properties based on your preferences.
      </p>
    </div>
  </div>

<form
    [formGroup]="filterForm"
    (ngSubmit)="applyFilter()">

    <mat-form-field appearance="outline">
      <mat-label>
        Location
      </mat-label>
      <input
        matInput
        formControlName="location"
        placeholder="e.g. Chandigarh"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Minimum Rent
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="minPrice"
      />

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Maximum Rent
      </mat-label>
      <input
        matInput
        type="number"
        formControlName="maxPrice"
      />
    </mat-form-field>

    <div class="actions">
      <button
        mat-flat-button
        type="submit">
        Search
      </button>

      <button
        mat-button
        type="button"
        (click)="clearFilter()">
        Clear
      </button>
    </div>
  </form>
</section>
