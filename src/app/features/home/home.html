<mat-form-field appearance="outline">
  <mat-label>
    Sort By
  </mat-label>

  <mat-select
    [value]="sortBy"
    (selectionChange)="onSortChanged($event.value)">

    <mat-option value="newest">
      Newest
    </mat-option>

    <mat-option value="priceLow">
      Price: Low to High
    </mat-option>

    <mat-option value="priceHigh">
      Price: High to Low
    </mat-option>

  </mat-select>

</mat-form-field>

  </div>


  <div class="apartment-grid">

    @for (
      apartment of paginatedApartments;
      track apartment.id
    ) {

      <app-apartment-card
        [apartment]="apartment">
      </app-apartment-card>

    }

  </div>

  <mat-paginator
  [length]="apartments.length"
  [pageSize]="pageSize"
  [pageSizeOptions]="[3, 6, 12]"
  (page)="onPageChanged($event)"
  aria-label="Apartment listings">
</mat-paginator>

</section>
